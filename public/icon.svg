<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="irisGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="105" fill="url(#bgGrad)"/>

  <!-- Sclera (White Eye Contour with shadow) -->
  <path d="M 76 256 C 140 142 372 142 436 256 C 372 370 140 370 76 256 Z" fill="#ffffff" filter="url(#shadow)"/>

  <!-- Iris -->
  <circle cx="256" cy="256" r="80" fill="url(#irisGrad)"/>
  <circle cx="256" cy="256" r="80" fill="none" stroke="#bae6fd" stroke-width="3.5"/>

  <!-- Pupil -->
  <circle cx="256" cy="256" r="44" fill="#0f172a"/>

  <!-- Cute Catchlights / Sparkles -->
  <circle cx="239" cy="235" r="15" fill="#ffffff" opacity="0.96"/>
  <circle cx="274" cy="266" r="8" fill="#ffffff" opacity="0.82"/>
  <circle cx="242" cy="278" r="4" fill="#ffffff" opacity="0.7"/>

  <!-- Cute Eye Drop (Colírio) -->
  <path d="M 256 68 C 284 108 292 134 274 148 C 264 158 248 158 238 148 C 220 134 228 108 256 68 Z" fill="url(#dropGrad)"/>
  <ellipse cx="249" cy="117" rx="5" ry="9" fill="#ffffff" opacity="0.9"/>

  <!-- Eyelid curve -->
  <path d="M 120 220 C 190 170 322 170 392 220" fill="none" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/>
</svg>

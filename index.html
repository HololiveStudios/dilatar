<body class="h-full bg-slate-100 text-slate-800 antialiased flex flex-col font-sans select-none md:select-auto">

  <!-- ========================================== -->

    <div class="max-w-5xl mx-auto px-3 sm:px-6">
      <div class="flex items-center justify-between h-14">
        
        <!-- Logo Bonitinha + Nome + Indicador Realtime -->
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl flex items-center justify-center shadow-sm shrink-0 overflow-hidden" style="background: linear-gradient(135deg, #0f766e 0%, #0284c7 100%);">
            <svg viewBox="0 0 100 100" class="w-7 h-7" fill="none">
              <path d="M 12 50 C 25 26 75 26 88 50 C 75 74 25 74 12 50 Z" fill="#ffffff"/>
              <circle cx="50" cy="50" r="16" fill="#0284c7"/>
              <circle cx="50" cy="50" r="16" stroke="#bae6fd" stroke-width="1.5"/>
              <circle cx="50" cy="50" r="9" fill="#0f172a"/>
              <circle cx="46.5" cy="46" r="3.2" fill="#ffffff"/>
              <circle cx="53.5" cy="52" r="1.6" fill="#ffffff" opacity="0.9"/>
              <circle cx="47" cy="54.5" r="0.8" fill="#ffffff" opacity="0.75"/>
              <path d="M 50 14 C 55 21 57 26 53 29 C 51 31 49 31 47 29 C 43 26 45 21 50 14 Z" fill="#38bdf8"/>
              <ellipse cx="48.5" cy="24" rx="1" ry="1.8" fill="#ffffff" opacity="0.9"/>
            </svg>
          </div>
          <div>
            <div class="flex items-center gap-1.5">
              <h1 class="text-base sm:text-lg font-bold text-slate-900 tracking-tight leading-none">OftalmoFlow</h1>
              <span id="cloudStatusDot" class="w-2 h-2 rounded-full bg-emerald-500 inline-block shrink-0 transition" title="Sincronizado com a nuvem em tempo real" style="width: 7px; height: 7px;"></span>
            </div>
          </div>
        </div>

        <!-- Botões de Ação do Topo -->
        <div class="flex items-center gap-2">
          <button id="btnInstallPwa" class="hidden sm:flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold shadow-sm transition active:scale-95 cursor-pointer">
            <svg class="icon-svg text-brand-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
            <span>Instalar App</span>
          </button>

          <button id="btnOpenModalNovo" class="flex items-center gap-1.5 px-3.5 py-1.5 sm:py-2 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-semibold text-xs sm:text-sm shadow-sm transition active:scale-95 cursor-pointer">
            <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
            <span>Novo Paciente</span>
          </button>
        </div>

      </div>
    </div>
  </header>

  <!-- ========================================== -->
  <!-- PAINEL DE ATENDIMENTOS                     -->
  <!-- ========================================== -->
  <main class="flex-1 max-w-5xl w-full mx-auto px-3 sm:px-6 py-2 sm:py-3 flex flex-col gap-2">
    
    <!-- Barra Rápida: Contadores + Botão Limpar Touch-Friendly para Tablets -->
    <div class="flex items-center justify-between px-1 py-1 text-xs text-slate-500">
      <div class="flex items-center gap-3">
        <span class="font-semibold text-slate-700 flex items-center gap-1">
          <span class="rounded-full bg-brand-600 inline-block" style="width: 7px; height: 7px;"></span> Ativos: <strong id="countAtivos" class="text-slate-900 ml-0.5">0</strong>
        </span>
        <span class="text-slate-300">|</span>
        <span class="text-slate-500 flex items-center gap-1">
          <span class="rounded-full bg-slate-400 inline-block" style="width: 7px; height: 7px;"></span> Concluídos: <strong id="countFinalizados" class="text-slate-700 ml-0.5">0</strong>
        </span>
      </div>

      <!-- BOTÃO LIMPAR TABLET-FRIENDLY (Abre modal próprio, sem confirm do navegador) -->
      <button type="button" id="btnAbrirModalLimpar" class="flex items-center gap-1 px-2.5 py-1.5 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-slate-500 hover:text-rose-600 font-semibold text-[11px] shadow-sm transition active:scale-95 cursor-pointer">
        <svg class="icon-svg-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        <span>Limpar Painel</span>
      </button>
    </div>

    <!-- LISTA DE CARDS (Atualização em Tempo Real) -->
    <div id="containerPacientes" class="flex flex-col gap-2 pb-16">
      <!-- Injetado dinamicamente -->
    </div>

    <!-- ESTADO VAZIO -->
    <div id="emptyState" class="hidden flex-col items-center justify-center py-16 px-4 text-center bg-white rounded-2xl border border-dashed border-slate-300">
      <div class="w-12 h-12 rounded-xl bg-slate-100 flex items-center justify-center text-slate-400 text-xl mb-2">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/></svg>
      </div>
      <h3 class="text-sm font-bold text-slate-800">Nenhum atendimento na fila</h3>
      <p class="text-xs text-slate-500 mt-1 max-w-xs">Clique no botão "+ Novo Paciente" para iniciar.</p>
    </div>

  </main>

  <!-- ========================================== -->
  <!-- MODAL TABLET-FRIENDLY: LIMPAR ATENDIMENTOS -->
  <!-- ========================================== -->
  <div id="modalLimpar" class="fixed inset-0 z-50 hidden bg-slate-900/60 flex items-center justify-center p-3" style="background-color: rgba(15, 23, 42, 0.65);">
    <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full overflow-hidden border border-slate-100 my-auto">
      
      <div class="bg-slate-900 px-4 py-3 text-white flex items-center justify-between">
        <div class="flex items-center gap-2">
          <svg class="icon-svg text-rose-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          <h2 class="text-sm font-bold">Limpar Atendimentos</h2>
        </div>
        <button type="button" id="btnCloseModalLimpar" class="text-white/80 hover:text-white p-1 rounded-lg cursor-pointer">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="p-4 flex flex-col gap-2.5">
        
        <!-- Opção 1: Limpar apenas concluídos -->
        <button type="button" id="btnAcaoLimparFinalizados" class="w-full py-3 px-3.5 rounded-xl bg-slate-50 hover:bg-slate-100 border border-slate-200 text-slate-800 font-bold text-xs sm:text-sm flex items-center justify-between transition active:scale-98 cursor-pointer">
          <span class="flex items-center gap-2">
            <span>🧹</span> Limpar Apenas Concluídos
          </span>
          <span id="badgeQtdFinalizados" class="px-2 py-0.5 rounded-md bg-slate-200 text-slate-700 text-xs font-mono font-bold">0</span>
        </button>

        <!-- Opção 2: Zerar tudo -->

  <!-- ========================================== -->
  <!-- JAVASCRIPT REALTIME & TABLET-OPTIMIZED     -->
  <!-- ========================================== -->
  <script>
    /**
     * OFTALMOFLOW - SINCRONIZAÇÃO EM TEMPO REAL COM CLOUDFLARE D1
     */

    const STORAGE_KEY = 'oftalmo_pacientes_cloud_v5';
    const TEMPO_LIMITE_MS = 10 * 60 * 1000; // 10 minutos de dilatação

    const state = {
      pacientes: [],
      lastSyncTimestamp: 0,
      isSyncing: false,
      isOnline: navigator.onLine,
      deferredPrompt: null
    };

    // Indicador visual de nuvem
    function setCloudStatus(status) {
      const dot = document.getElementById('cloudStatusDot');
      if (!dot) return;
      if (status === 'syncing') {
        dot.className = 'w-2 h-2 rounded-full bg-amber-500 inline-block shrink-0 animate-pulse';
        dot.title = 'Sincronizando com a nuvem...';
      } else if (status === 'offline') {
        dot.className = 'w-2 h-2 rounded-full bg-slate-400 inline-block shrink-0';
        dot.title = 'Modo offline (dados salvos localmente)';
      } else {
        dot.className = 'w-2 h-2 rounded-full bg-emerald-500 inline-block shrink-0';
        dot.title = 'Sincronizado com a nuvem em tempo real';
      }
    }

    // 1. CARREGAMENTO INICIAL ULTRA-RÁPIDO (Cache Local + Nuvem)
    function carregarLocal() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('oftalmo_pacientes_v4');
        if (raw) {
          const parsed = JSON.parse(raw);
          state.pacientes = Array.isArray(parsed) ? parsed : [];
        } else {
          state.pacientes = [];
        }
      } catch (err) {
        state.pacientes = [];
      }
      renderPacientes();
      atualizarContadores();
    }

    function salvarLocal() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.pacientes));
      } catch (err) {}
      renderPacientes();
      atualizarContadores();
    }

    // 2. SINCRONIZAÇÃO EM TEMPO REAL COM CLOUDFLARE D1
    async function carregarDaNuvem() {
      if (!navigator.onLine) {
        setCloudStatus('offline');
        return;
      }
      setCloudStatus('syncing');
      try {
        const res = await fetch('/api/pacientes', { cache: 'no-store' });
        if (res.ok) {
          const dados = await res.json();
          if (Array.isArray(dados)) {
            state.pacientes = dados;
            state.lastSyncTimestamp = Date.now();
            salvarLocal();
          }
          setCloudStatus('online');
        }
      } catch (err) {
        setCloudStatus('offline');
      }
    }

    // Loop de tempo real leve (Polling delta que gasta quase 0 bytes quando inalterado)
    async function verificarSincronizacaoRealtime() {
      if (state.isSyncing || !navigator.onLine) return;
      state.isSyncing = true;
      try {
        const res = await fetch('/api/sync?since=' + state.lastSyncTimestamp, { cache: 'no-store' });
        if (res.ok) {
          const data = await res.json();
          if (data.changed && Array.isArray(data.pacientes)) {
            state.pacientes = data.pacientes;
            state.lastSyncTimestamp = data.last_updated || Date.now();
            salvarLocal();
          } else if (data.last_updated) {
            state.lastSyncTimestamp = data.last_updated;
          }
          setCloudStatus('online');
        }
      } catch (err) {
        setCloudStatus('offline');
      } finally {
        state.isSyncing = false;
      }
    }

    // 3. PERSISTÊNCIA NA NUVEM VIA API CLOUDFLARE
    async function salvarPacienteNaApi(p) {
      salvarLocal();
      if (!navigator.onLine) return;
      try {
        await fetch('/api/pacientes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(p)
        });
        state.lastSyncTimestamp = Date.now();

    // 4. CRONÔMETRO
    function calcularTempoDecorrido(timestamp) {
      if (!timestamp) return { texto: '--:--', totalSegundos: 0, passouLimite: false };
      const diffMs = Math.max(0, Date.now() - timestamp);
      const totalSegundos = Math.floor(diffMs / 1000);
      const minutos = Math.floor(totalSegundos / 60);
      const segundos = totalSegundos % 60;
      const texto = String(minutos).padStart(2, '0') + ':' + String(segundos).padStart(2, '0');
      const passouLimite = diffMs >= TEMPO_LIMITE_MS;
      return { texto, totalSegundos, passouLimite };
    }

    // 5. RENDERIZAÇÃO DOS CARDS
    function renderPacientes() {
      const container = document.getElementById('containerPacientes');
      const emptyState = document.getElementById('emptyState');
      if (!container) return;

      if (!state.pacientes || state.pacientes.length === 0) {
        container.innerHTML = '';
        emptyState.classList.remove('hidden');
        emptyState.classList.add('flex');
        return;
      }

      emptyState.classList.add('hidden');
      emptyState.classList.remove('flex');

      const ordenados = [...state.pacientes].sort((a, b) => {
        if (a.status === 'atendimento' && b.status === 'finalizado') return -1;
        if (a.status === 'finalizado' && b.status === 'atendimento') return 1;
        return (b.timestamp_criacao || 0) - (a.timestamp_criacao || 0);
      });

      container.innerHTML = ordenados.map(p => criarCardHTML(p)).join('');
      vincularEventos();
    }

    // 6. LOOP DO CRONÔMETRO
    function iniciarLoopCronometro() {
      setInterval(() => {
        document.querySelectorAll('.timer-display').forEach(el => {
          const timestamp = parseInt(el.getAttribute('data-timestamp'), 10);
          const isDilatando = el.getAttribute('data-dilatando') === 'true';
          if (timestamp && !isNaN(timestamp)) {
            const tempo = calcularTempoDecorrido(timestamp);
            if (el.textContent !== tempo.texto) {
              el.textContent = tempo.texto;
            }
            if (isDilatando && tempo.passouLimite && !el.parentElement.classList.contains('text-rose-600')) {
              el.parentElement.classList.remove('text-slate-800');
              el.parentElement.classList.add('text-rose-600', 'font-extrabold', 'animate-pulse');
            }
          }
        });
      }, 1000);
    }

    // 7. GERENCIAMENTO DE AÇÕES DOS BOTÕES
    function vincularEventos() {
      document.querySelectorAll('.btn-avancar').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-id');
          const action = btn.getAttribute('data-action');
          executarAcao(id, action);
        });
      });

      document.querySelectorAll('.btn-editar').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-id');
          abrirModalEditar(id);
        });
      });
    }

    function executarAcao(id, action) {
      const p = state.pacientes.find(item => item.id === id);
      if (!p) return;
      const agora = Date.now();

      if (action === 'pingar-gota1') {
        p.etapa = 2;
        p.timestamp_gota1 = agora;
        atualizarPacienteNaApi(p);
        mostrarToast('1ª Gota aplicada: ' + p.nome);
      } else if (action === 'pingar-gota2') {
        p.etapa = 3;
        p.timestamp_gota2 = agora;
        atualizarPacienteNaApi(p);
        mostrarToast('2ª Gota aplicada: ' + p.nome);
      } else if (action === 'avancar-etapa') {
        p.etapa = 2;
        atualizarPacienteNaApi(p);
        mostrarToast(p.nome + ' em atendimento');
      } else if (action === 'finalizar-consulta' || action === 'finalizar-geral') {
        if (!p.pressaoOcularOD && !p.pressaoOcularOE) {
          abrirModalTonometriaRapida(p);
        } else {
          p.etapa = 4;
          p.status = 'finalizado';
          p.timestamp_finalizado = agora;
          atualizarPacienteNaApi(p);
          mostrarToast(p.nome + ' concluído');
        }
      } else if (action === 'reabrir') {
        p.status = 'atendimento';
        p.etapa = p.tipo === 'consulta' ? 3 : 2;
        atualizarPacienteNaApi(p);
        mostrarToast(p.nome + ' reaberto');
      }
    }

    // 8. FUNÇÃO DO BOTÃO "COLAR" DA ÁREA DE TRANSFERÊNCIA
    async function colarTextoNoInput(inputEl, btnEl) {
      try {
        if (navigator.clipboard && navigator.clipboard.readText) {
          const texto = await navigator.clipboard.readText();
          if (texto && texto.trim()) {
            inputEl.value = texto.trim();
            inputEl.focus();
            mostrarToast('Texto colado!');
            return;
          }
        }
      } catch (err) {}
      inputEl.focus();
      mostrarToast('Pressione no campo para colar');
    }

        document.getElementById('novoPosPtgOlho').value = val;
        document.querySelectorAll('#groupOlhosPosPtg .btn-olho-ptg').forEach(b => {
          b.className = 'btn-olho-ptg py-1.5 rounded-lg border border-emerald-300 bg-white text-emerald-900 font-bold text-xs cursor-pointer text-center';
        });
        btn.className = 'btn-olho-ptg py-1.5 rounded-lg border border-emerald-600 bg-emerald-600 text-white font-bold text-xs cursor-pointer text-center shadow-sm';
      });
    });

    document.querySelectorAll('#chipsPeriodoPosPtg .chip-periodo-ptg').forEach(chip => {
      chip.addEventListener('click', () => {
        const val = chip.getAttribute('data-val');
        document.getElementById('novoPeriodoPosPtg').value = val;
        document.querySelectorAll('#chipsPeriodoPosPtg .chip-periodo-ptg').forEach(c => {
          c.className = 'chip-periodo-ptg px-2 py-0.5 rounded text-[11px] font-bold border border-emerald-200 bg-white text-emerald-800 cursor-pointer';
        });
        chip.className = 'chip-periodo-ptg px-2 py-0.5 rounded text-[11px] font-bold border border-emerald-600 bg-emerald-600 text-white cursor-pointer';
      });
    });

    // 10. MODAL NOVO PACIENTE
    const modalNovo = document.getElementById('modalNovoPaciente');
    document.getElementById('btnOpenModalNovo').addEventListener('click', () => {
      document.getElementById('formNovoPaciente').reset();
      selecionarTipo('consulta');
      modalNovo.classList.remove('hidden');
      setTimeout(() => document.getElementById('novoNome').focus(), 50);
    });

    const fecharModalNovo = () => modalNovo.classList.add('hidden');
    document.getElementById('btnCloseModalNovo').addEventListener('click', fecharModalNovo);
    document.getElementById('btnCancelModalNovo').addEventListener('click', fecharModalNovo);

    document.getElementById('formNovoPaciente').addEventListener('submit', (e) => {
      e.preventDefault();
      const nome = document.getElementById('novoNome').value.trim();
      const idadeRaw = document.getElementById('novoIdade').value.trim();
      const idade = idadeRaw ? parseInt(idadeRaw, 10) : null;
      const tipo = inputTipoNovo.value || 'consulta';

      if (!nome) return;
      const agora = Date.now();

      let tipoExame = '';
      let periodo = '';
      let olhos = '';

      if (tipo === 'exame') {
        tipoExame = document.getElementById('novoExameNome').value;
      } else if (tipo === 'pos_refrativa') {
        periodo = document.getElementById('novoPeriodoRefrativa').value.trim();
      } else if (tipo === 'caps') {
        olhos = document.getElementById('novoCapsOlho').value || '';
      } else if (tipo === 'pos_caps') {
        periodo = document.getElementById('novoPeriodoPosCaps').value.trim();
        olhos = document.getElementById('novoPosCapsOlho').value || '';
      } else if (tipo === 'pos_ptg') {
        olhos = document.getElementById('novoPosPtgOlho').value || '';
        periodo = document.getElementById('novoPeriodoPosPtg').value.trim();
      }

      const novo = {
        id: 'p-' + agora + '-' + Math.random().toString(36).substring(2, 6),
        nome,
        idade,
        tipo,
        tipoExame,
        periodo,
        olhos,
        etapa: 1,
        status: 'atendimento',
        timestamp_criacao: agora,
        timestamp_gota1: null,
        timestamp_gota2: null,
        timestamp_finalizado: null,
        pressaoOcularOD: '',
        pressaoOcularOE: ''
      };

      state.pacientes.unshift(novo);
      salvarPacienteNaApi(novo);
      fecharModalNovo();
      mostrarToast(nome + ' adicionado');
    });

    // 11. MODAL EDITAR PACIENTE
    const modalEdit = document.getElementById('modalEditarPaciente');
    function abrirModalEditar(id) {
      const p = state.pacientes.find(item => item.id === id);
      if (!p) return;
      document.getElementById('editPacienteId').value = p.id;
      document.getElementById('editNome').value = p.nome;
      document.getElementById('editIdade').value = p.idade !== null && p.idade !== undefined ? p.idade : '';
      document.getElementById('editTonometriaOD').value = p.pressaoOcularOD || '';
      document.getElementById('editTonometriaOE').value = p.pressaoOcularOE || '';
      modalEdit.classList.remove('hidden');
    }

    const fecharModalEdit = () => modalEdit.classList.add('hidden');
    document.getElementById('btnCloseModalEdit').addEventListener('click', fecharModalEdit);
    document.getElementById('btnCancelModalEdit').addEventListener('click', fecharModalEdit);

    document.getElementById('formEditarPaciente').addEventListener('submit', (e) => {
      e.preventDefault();
      const id = document.getElementById('editPacienteId').value;
      const p = state.pacientes.find(item => item.id === id);
      if (!p) return;

      const idadeRaw = document.getElementById('editIdade').value.trim();
      p.nome = document.getElementById('editNome').value.trim();
      p.idade = idadeRaw ? parseInt(idadeRaw, 10) : null;
      p.pressaoOcularOD = document.getElementById('editTonometriaOD').value.trim();
      p.pressaoOcularOE = document.getElementById('editTonometriaOE').value.trim();

      atualizarPacienteNaApi(p);
      fecharModalEdit();
      mostrarToast('Registro atualizado');
    });

    document.getElementById('btnExcluirPaciente').addEventListener('click', () => {
      const id = document.getElementById('editPacienteId').value;
      const p = state.pacientes.find(item => item.id === id);
      if (!p) return;
      state.pacientes = state.pacientes.filter(item => item.id !== id);
      deletarPacienteNaApi(id);
      fecharModalEdit();
      mostrarToast('Paciente removido');
    });

    // 12. MODAL TONOMETRIA RÁPIDA
    const modalRapida = document.getElementById('modalTonometriaRapida');
    function abrirModalTonometriaRapida(paciente) {
      document.getElementById('rapidaPacienteId').value = paciente.id;
      document.getElementById('rapidaPacienteNome').textContent = paciente.nome;
      document.getElementById('rapidaOD').value = paciente.pressaoOcularOD || '';
      document.getElementById('rapidaOE').value = paciente.pressaoOcularOE || '';
      modalRapida.classList.remove('hidden');
      setTimeout(() => document.getElementById('rapidaOD').focus(), 50);
    }

    document.getElementById('btnCancelRapida').addEventListener('click', () => modalRapida.classList.add('hidden'));

    document.getElementById('formTonometriaRapida').addEventListener('submit', (e) => {
      e.preventDefault();
      const id = document.getElementById('rapidaPacienteId').value;
      const p = state.pacientes.find(item => item.id === id);
      if (!p) return;

      p.pressaoOcularOD = document.getElementById('rapidaOD').value.trim();
      p.pressaoOcularOE = document.getElementById('rapidaOE').value.trim();
      p.etapa = 4;
      p.status = 'finalizado';
      p.timestamp_finalizado = Date.now();

      atualizarPacienteNaApi(p);
      modalRapida.classList.add('hidden');
      mostrarToast(p.nome + ' concluído');
    });

    // 13. MODAL DE LIMPEZA TABLET-FRIENDLY (Substitui confirm que falha em tablets)
    const modalLimpar = document.getElementById('modalLimpar');
    document.getElementById('btnAbrirModalLimpar').addEventListener('click', () => {
      const qtdFinalizados = state.pacientes.filter(p => p.status === 'finalizado').length;
      document.getElementById('badgeQtdFinalizados').textContent = qtdFinalizados;
      document.getElementById('badgeQtdTotal').textContent = state.pacientes.length;
      modalLimpar.classList.remove('hidden');
    });

    const fecharModalLimpar = () => modalLimpar.classList.add('hidden');
    document.getElementById('btnCloseModalLimpar').addEventListener('click', fecharModalLimpar);
    document.getElementById('btnCancelarModalLimpar').addEventListener('click', fecharModalLimpar);

    document.getElementById('btnAcaoLimparFinalizados').addEventListener('click', () => {
      limparFinalizadosNaApi();
      fecharModalLimpar();
      mostrarToast('Concluídos removidos');
    });

    document.getElementById('btnAcaoLimparTodos').addEventListener('click', () => {
      limparTodosNaApi();
      fecharModalLimpar();
      mostrarToast('Painel zerado');
    });

    function atualizarContadores() {
      document.getElementById('countAtivos').textContent = state.pacientes.filter(p => p.status === 'atendimento').length;
      document.getElementById('countFinalizados').textContent = state.pacientes.filter(p => p.status === 'finalizado').length;
    }

    // 14. TOAST
    let toastTimer = null;
    function mostrarToast(msg) {
      const toast = document.getElementById('toastNotification');
      if (!toast) return;
      clearTimeout(toastTimer);
      toast.innerHTML = '<svg class="icon-svg text-brand-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg> <span>' + msg + '</span>';
      toast.classList.remove('opacity-0', 'translate-y-16');
      toast.classList.add('opacity-100', 'translate-y-0');
      toastTimer = setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'translate-y-16');
      }, 2000);
    }

    // 15. PWA INSTALAÇÃO
    const btnInstallPwa = document.getElementById('btnInstallPwa');
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    if (isStandalone && btnInstallPwa) {
      btnInstallPwa.classList.add('hidden');
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      state.deferredPrompt = e;
      if (btnInstallPwa && !isStandalone) {
        btnInstallPwa.classList.remove('hidden');
      }
    });

    if (btnInstallPwa) {
      btnInstallPwa.addEventListener('click', async () => {
        if (state.deferredPrompt) {
          state.deferredPrompt.prompt();
          const { outcome } = await state.deferredPrompt.userChoice;
          if (outcome === 'accepted') {
            btnInstallPwa.classList.add('hidden');
            mostrarToast('Aplicativo instalado!');
          }
          state.deferredPrompt = null;
        } else {
          mostrarToast('Toque em Compartilhar > Adicionar à Tela de Início');
        }
      });
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(err => {});
      });
    }

    // 16. INICIALIZAÇÃO E REALTIME SYNC
    window.addEventListener('online', () => {
      state.isOnline = true;
      carregarDaNuvem();
    });

    window.addEventListener('offline', () => {
      state.isOnline = false;
      setCloudStatus('offline');
    });

    window.addEventListener('focus', () => {
      verificarSincronizacaoRealtime();
    });

    document.addEventListener('DOMContentLoaded', () => {
      // 1. Carrega localmente (0ms)
      carregarLocal();
      iniciarLoopCronometro();

      // 2. Busca nuvem
      carregarDaNuvem();

      // 3. Inicia loop de sincronização em tempo real (a cada 2.5s)
      setInterval(verificarSincronizacaoRealtime, 2500);

      // Atalho de URL ?novo=true
      const params = new URLSearchParams(window.location.search);
      if (params.get('novo') === 'true') {
        document.getElementById('btnOpenModalNovo').click();
      }
    });
  </script>
</body>
</html>
